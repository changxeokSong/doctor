# 일반 x86_64 서버(NVIDIA GPU 2장, 예: RTX/A6000 등)용 오버레이 - docker-compose.yml은 2026-08-10부로
# DGX Spark(GB10 Grace Blackwell, arm64/sm_121, GPU 물리 1장) 전용으로 바뀌어서 일반 x86_64 서버에는
# 안 맞는다(base image가 arm64 전용 NGC 컨테이너, GPU도 count:1로만 지정). 이 파일은 base
# docker-compose.yml 위에 "다른 부분만" 덮어쓴다 - volumes/ports/restart 등은 그대로 상속.
#
# 사용법(반드시 -f 두 개를 같이 줘야 함, base 파일 단독 실행 X):
#   docker compose -f docker-compose.yml -f docker-compose.x86-2gpu.yml up -d --build
#
# backend=GPU 0 / jungwoo=GPU 1로 물리 분리한다(2026-08-10 이전 실제 운영 구성,
# backups/infra_20260810_before_dgxspark_gb10/docker-compose.yml 그대로 복원) - 카드가 2장이라
# DGX Spark(통합 SoC, 카드 1장)와 달리 VRAM을 나눠 쓸 수 있다. 서버에 GPU가 1장뿐이면 이 오버레이
# 대신 base docker-compose.yml을 그대로(오버레이 없이) 쓸 것 - device_ids로 없는 카드를 가리키면
# 컨테이너가 안 뜬다.
services:
  backend:
    build:
      dockerfile: Dockerfile.backend.x86
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          # !override 필수 - 없으면 base 파일의 count:1 항목과 리스트로 합쳐져(Compose 기본 병합 규칙이
          # devices 리스트를 이어붙임) GPU를 2장 예약해버린다(docker compose config로 실측 확인, 2026-08-19).
          devices: !override
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  jungwoo:
    build:
      dockerfile: jungwoo/Dockerfile.x86
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

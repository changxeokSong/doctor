# 일반 x86_64 + GPU 2장 서버용 오버레이 - base docker-compose.yml(DGX Spark용, GPU 1장 전제) 위에
# backend=GPU 0 / jungwoo=GPU 1로 물리 분리해서 덮어쓴다. GPU가 1장뿐이면 이 오버레이 없이 base만 쓸 것
# - device_ids가 없는 카드를 가리키면 컨테이너가 안 뜬다.
#
# 사용법(반드시 -f 두 개를 같이 줘야 함):
#   docker compose -f docker-compose.yml -f docker-compose.x86-2gpu.yml up -d --build
services:
  backend:
    build:
      dockerfile: Dockerfile.backend.x86
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          # !override 필수 - 없으면 base의 count:1과 리스트로 합쳐져 GPU를 2장 예약해버린다.
          devices: !override
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  jungwoo:
    build:
      dockerfile: jungwoo/Dockerfile.x86
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

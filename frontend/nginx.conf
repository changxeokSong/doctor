# proxy_pass에 호스트명을 직접 쓰면 시작 시점에 DNS를 풀어서, 그 컨테이너가 아직 안 떠 있으면
# nginx 자체가 부팅을 거부한다 - set 변수로 담아 매 요청마다 지연 resolve하도록 우회한다.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    location /api/ {
        set $backend_upstream http://backend:8000;
        # proxy_pass가 변수를 쓰면 nginx가 접두어 자동 치환을 안 하므로 $request_uri를 직접 붙인다.
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 무거운 임베딩 모델 콜드 스타트가 60초를 넘길 수 있어 기본 타임아웃(60s)보다 늘린다.
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Streamlit(jungwoo)은 웹소켓을 쓰므로 Upgrade/Connection 헤더 필요.
    location /jungwoo/ {
        set $jungwoo_upstream http://jungwoo:8501;
        proxy_pass $jungwoo_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}

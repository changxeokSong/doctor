# 개발 환경(vite.config.ts)의 /api 프록시를 프로덕션에서 nginx로 그대로 재현한다.
#
# resolver + 변수 프록시(2026-07-27, ISSUE-87 추가검증): proxy_pass에 호스트명을 그냥 문자열로
# 쓰면(예: http://jungwoo:8501) nginx가 그 이름을 "시작 시점에" DNS로 풀어두는데, 그때 그
# 컨테이너가 아직 안 떠 있거나 죽어있으면 nginx 자체가 부팅을 거부한다("host not found in
# upstream") — jungwoo 하나가 안 뜨는 바람에 frontend 전체(메인 앱 포함)가 같이 죽는 실제
# 사고를 로컬 테스트에서 재현해서 발견했다. set으로 변수에 담아 proxy_pass하면 매 요청마다
# 그때그때(lazy) 이 도커 내장 DNS(127.0.0.11)로 다시 풀어서, 특정 백엔드가 늦게 뜨거나 잠깐
# 죽어도 nginx 자체는 정상 기동하고 그 경로만 502를 내려준다.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    location /api/ {
        set $backend_upstream http://backend:8000;
        # ⚠ proxy_pass가 변수를 쓰면 nginx가 "location 매칭된 접두어를 나머지 URI로 자동 치환"을
        # 안 한다(정적 문자열일 때만 되는 동작) — 그래서 $backend_upstream/api/처럼 뒤에 고정
        # 경로를 붙이면 실제 요청이 뭐였든 전부 그 고정 경로("/api/")로만 전달돼버린다(2026-07-27
        # 실서버에서 /api/dataset-stats/ 등이 전부 404 나는 사고로 발견). $request_uri(원래 요청
        # 경로+쿼리스트링 그대로)를 붙여야 실제 하위 경로가 살아남는다.
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # F2LLM-0.6B·e5-large-instruct(560M) 같은 무거운 임베딩 모델은 콜드 스타트 때(공유 GPU
        # 여유가 없으면 특히) 60초를 넘길 수 있다 - nginx 기본값(60s)이라 백엔드는 멀쩡히 응답 중인데
        # nginx가 먼저 504로 끊어버리는 문제가 실제로 있었다(2026-07-26). 넉넉하게 늘려둔다.
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # jungwoo의 별도 Streamlit 앱(2026-07-27) — 같은 8778 포트(2026-08-31부로 8777에서 변경) 밑에 하위 경로로 프록시한다.
    # Streamlit은 웹소켓(실시간 갱신)을 쓰므로 Upgrade/Connection 헤더가 꼭 필요하고,
    # Dockerfile의 --server.baseUrlPath=jungwoo와 짝을 맞춰 정적 리소스 경로가 어긋나지 않게 한다.
    location /jungwoo/ {
        set $jungwoo_upstream http://jungwoo:8501;
        # 위 /api/와 같은 이유로 $request_uri를 붙인다(고정 경로 대신 실제 요청 경로 그대로 전달).
        proxy_pass $jungwoo_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}

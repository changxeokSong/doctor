services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # 모델·캐시·코퍼스·로그는 이미지에 안 굽고 호스트에서 마운트 - 재빌드 없이 갱신 가능.
      - ./models:/srv/models
      - ./cache:/srv/cache
      - ./cache/huggingface:/root/.cache/huggingface
      - ./logs:/srv/logs
      - ./backups:/srv/backups
      - ./corpus/통증의학과_초진_의사문의_답변_키워드_이현_0528.xlsx:/srv/corpus/통증의학과_초진_의사문의_답변_키워드_이현_0528.xlsx
      - ./corpus/통증의학과_모델입력_균형보강_학습준비본_0528.xlsx:/srv/corpus/통증의학과_모델입력_균형보강_학습준비본_0528.xlsx
      - ./corpus/ETRI_KSL_Dictionary_r40_서강대658_20260725.xlsx:/srv/corpus/ETRI_KSL_Dictionary_r40_서강대658_20260725.xlsx
      # 코드도 마운트 - runserver의 StatReloader가 변경을 감지해 재빌드 없이 hot-reload된다.
      - ./app:/srv/app
      - ./backend:/srv/backend
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    shm_size: '2g'  # PyTorch/transformers가 도커 기본 /dev/shm(64MB)로는 부족할 수 있음
    # GPU 물리 1장(SoC 통합) 전제 - count:1로 "있으면 붙인다"만 지정해 없는 인덱스를 안 가리키게 함.
    # 구버전 docker-compose(v1)는 이 블록 대신 최상위에 `runtime: nvidia`.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  jungwoo:
    build:
      context: .
      dockerfile: jungwoo/Dockerfile
    # 외부 포트 없음 - nginx(frontend)가 내부 네트워크로만 /jungwoo/ 프록시. backend와 별개 컨테이너지만
    # GPU는 물리 1장을 공유(동시에 무거운 모델을 여러 개 올리면 OOM 위험).
    volumes:
      - ./jungwoo:/srv  # Streamlit이 파일 변경을 자체 감지해 재빌드 없이 반영
      - ./cache/huggingface:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    shm_size: '2g'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8778:80"
    depends_on:
      - backend
      - jungwoo
    restart: unless-stopped

version: "3.9"

services:
  # ── Streamlit Q&A 앱 ──────────────────────────────────────────────
  streamlit:
    build: .
    container_name: pain-qa-streamlit
    ports:
      - "8501:8501"
    volumes:
      # HuggingFace 모델 캐시: 재시작해도 재다운로드 방지
      - hf_cache:/app/.cache/huggingface
    environment:
      - HF_HOME=/app/.cache/huggingface
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    command: >
      python -m streamlit run app.py
      --server.address 0.0.0.0
      --server.port 8501

  # ── FastAPI REST 서버 (선택 사항) ─────────────────────────────────
  api:
    build: .
    container_name: pain-qa-api
    ports:
      - "8502:8502"
    volumes:
      - hf_cache:/app/.cache/huggingface
    environment:
      - HF_HOME=/app/.cache/huggingface
    restart: unless-stopped
    command: >
      python -m uvicorn api:app
      --host 0.0.0.0
      --port 8502
    profiles:
      - api   # docker compose --profile api up 으로만 실행

volumes:
  hf_cache:
    driver: local
